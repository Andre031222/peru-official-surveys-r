url: https://andre031222.github.io/faperu/
lang: es

template:
  bootstrap: 5
  bslib:
    primary: "#8C1D18"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Serif 4"}
    code_font: {google: "JetBrains Mono"}

home:
  title: "faperu: encuestas y censos oficiales del Perú en R"
  description: >
    Descarga, caché verificada con SHA-256, lectura y diseño muestral de diez
    fuentes oficiales del Perú: ENAHO, ENDES, ENA, EPEN, ENAPRES, ENUT, ENARES,
    EEA, Censo Educativo y Censos 2017.

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/Andre031222/faperu
      aria-label: GitHub

