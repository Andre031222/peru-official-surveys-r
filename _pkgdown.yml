url: https://faperu.ftorres.org/docs
lang: es

# One site for the whole package. The standard pkgdown layout with a modern finish: a home button, a single
# theme button (automatic by default), quiet code blocks and a real footer.
# Extra styles and the theme button live in pkgdown/extra.css and extra.js.
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#ffffff"
    fg: "#1d1d1f"
    primary: "#0e7c86"
    secondary: "#14558f"
    link-color: "#0e7c86"
    border-radius: 0.5rem
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    headings-font-weight: 700

home:
  title: "faperu: encuestas y censos oficiales del Perú en R"
  description: >
    Descarga verificada, lectura, diseño muestral, estimaciones con banda de
    calidad del INEI, indicadores oficiales, tablas y mapas para diez fuentes
    oficiales del Perú.
  sidebar:
    structure: [links, license, citation, people]
    components:
      people:
        title: Autores
        text: >
          [Fred Torres Cruz](https://orcid.org/0000-0003-0834-6834)<br>
          [Richar Andre Vilca Solorzano](https://orcid.org/0009-0003-2385-5263)
  links:
  - text: Sitio de faperu
    href: https://faperu.ftorres.org/
  - text: Explorar los módulos en línea
    href: https://faperu.ftorres.org/explore
  - text: Tablero de indicadores 2024
    href: https://faperu.ftorres.org/dashboard

navbar:
  bg: dark
  structure:
    left: [home, intro, analysis, gallery, reference, articles, news]
    right: [search, explore, github, theme]
  components:
    home:
      icon: fa-house
      text: Inicio
      href: index.html
    intro:
      text: Empezar
      href: articles/faperu.html
    analysis:
      text: Analizar
      href: articles/analysis.html
    gallery:
      text: Galería
      href: articles/galeria.html
    reference:
      text: Funciones
      href: reference/index.html
    articles:
      text: Artículos
      menu:
      - text: Instalar paso a paso
        href: articles/instalar.html
      - text: Las diez fuentes, en cifras
        href: articles/fuentes.html
      - text: "Obtener los datos: guía completa"
        href: articles/faperu.html
      - text: "Analizar: estimaciones, indicadores y mapas"
        href: articles/analysis.html
      - text: Galería de indicadores 2024
        href: articles/galeria.html
    news:
      text: Cambios
      href: news/index.html
    explore:
      icon: fa-magnifying-glass-chart
      text: Explorar
      href: https://faperu.ftorres.org/explore
    github:
      icon: fa-github
      href: https://github.com/Andre031222/peru-official-surveys-r
      aria-label: GitHub
    theme:
      icon: fa-circle-half-stroke
      href: "#theme"
      aria-label: Cambiar tema

reference:
- title: "Qué hay"
  desc: "Las fuentes, sus años y sus módulos, sin descargar nada."
  contents:
  - fa_surveys
  - fa_years
  - fa_catalog
  - fa_check_updates
- title: "Bajar y leer"
  desc: "Descarga verificada con SHA-256 y lectura por columnas."
  contents:
  - fa_download
  - fa_read
  - fa_variables
  - fa_key
  - fa_cache
- title: "Ubigeo y territorio"
  desc: "Primero el territorio: el ubigeo armonizado al marco del Censo 2017."
  contents:
  - fa_ubigeo
  - fa_districts
- title: "Diseño muestral"
  desc: "El diseño verificado de cada encuesta, para todo el país o para un territorio."
  contents:
  - fa_design
- title: "Censo 2017"
  contents:
  - fa_redatam
- title: "Estimar"
  desc: "Media, proporción o total por dominio, con error estándar, intervalo, CV y banda de calidad del INEI."
  contents:
  - fa_estimate
  - fa_quality
- title: "Indicadores listos"
  desc: "Siete indicadores que reproducen las cifras oficiales del INEI."
  contents:
  - fa_indicators
  - fa_indicator
- title: "Cruzar encuestas"
  contents:
  - fa_link
- title: "Mapas y tablas"
  contents:
  - fa_geometry
  - fa_map
  - fa_table
- title: "Impresión, resumen y gráfico"
  contents:
  - faperu-methods
  - estimate-methods
- title: "Paquete"
  contents:
  - faperu-package

footer:
  structure:
    left: [about]
    right: [made]
  components:
    about: >
      **faperu** · Fred Torres Cruz y Richar Andre Vilca Solorzano · Licencia MIT<br>
      Independiente del INEI y del MINEDU; nunca redistribuye microdatos.
    made: >
      [GitHub](https://github.com/Andre031222/peru-official-surveys-r) ·
      Hecho con [pkgdown](https://pkgdown.r-lib.org/)
