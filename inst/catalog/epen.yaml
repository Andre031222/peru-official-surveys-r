id: epen
siglas: EPEN
nombre: Encuesta Permanente de Empleo Nacional (y EPE Lima Metropolitana como serie histórica)
organismo: INEI
tipo: encuesta
fuente: inei_portal
portal:
  encuesta: [EPEN – CIUDADES, EPEN – DEPARTAMENTOS, EPEN – LIMA METROPOLITANA Y CALLAO, EPE – LIMA METROPOLITANA Y CALLAO]
url: https://proyectos.inei.gob.pe/iinei/srienaho/descarga/{formato}/{archivo}
formatos: [CSV, STATA, SPSS]
anios: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
unidad: persona
ubigeo: UBIGEO
diseno:
  peso: [FAC300_ANUAL, FAC_T300, 're:^fa_[a-z]{3}[0-9]{2}$']
  escala: 1
  estrato: [CCDD*ESTRATO, ESTRATO]
  conglomerado: [CONGLOMERADO, CONGLOME]
  filtro: peso>0
  verificado: true
  nota: 'Verificado en las cabeceras de EPEN Departamentos 2025 (FAC300_ANUAL), Ciudades 2025 T1 (FAC_T300), Lima 2026 (fa_def26) y EPE Lima 2022 (fa_efm22, conglome, estrato). En Lima el factor se llama fa_ más el trimestre móvil y el año. El peso solo existe para personas de 14 años o más: las filas sin peso se quitan. El estrato del diseño es departamento por ESTRATO, porque la muestra es independiente en cada departamento; sin CCDD (Lima) se usa ESTRATO. UPM = conglomerado.'
  documento: ['INEI, Ficha Técnica EPEN 2025 (Ciudades y Departamentos), portal de microdatos, documentación 2025-184 y 2025-156', 'INEI, Ficha Técnica EPEN Lima Metropolitana y Callao, documentación 2025-28']
estado: Catálogo de mayo de 2026. Sin descargar todavía.
